# Weekly update proposals for the pinned npm dependencies and for the actions
# the workflows use. Updates keep the exact pins (`npm run check:pins`). The Pi
# packages move as one group: they ship as a set, and a partial bump would
# leave two copies of a package in the tree; vitest and its plugins, and
# CodeQL's init and analyze actions, likewise.
# A version update waits 7 days after its release, so a hijacked release has
# time to be caught first. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 7
    groups:
      pi:
        patterns:
          - '@earendil-works/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - 'github/codeql-action/*'
    commit-message:
      prefix: ci
      include: scope
