name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run lint:deps
      - run: npm run check:pi
      - run: npx biome ci .
      - run: npm run docs:check
  binary-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The shipped artifact (bin/kubic.js over dist/) is proven per push:
      # build, then pin the version line, doctor's provider-down exit 6 +
      # reason, and the provider-less run -p ref triple. Hermetic: HOME is a
      # temp dir, no models.json in the cwd, no provider, no network.
      - run: npm run build
      - run: npm run test:binary-contract
  mutation:
    runs-on: ubuntu-latest
    # Temporarily disabled: the vitest side grinds ~9h per run (20k mutants x
    # full-suite-each, no incremental cache on fresh checkouts) while gating
    # nothing. See the backlog issue "Mutation CI: 9h runs" for the full
    # diagnosis and the re-enable plan (nightly schedule + scope caps +
    # incremental cache). Re-enable by restoring the `if:` below.
    if: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Mutation gate on touched scope (per-file >= 80)
        # Vitest side is advisory until the upstream vitest-runner supports
        # vitest 5 name matching (see docs/contributing.md "Known blocker").
        # Tap side blocks.
        run: |
          REF="${{ github.event.pull_request.base.sha }}"
          if [ -z "$REF" ]; then REF="HEAD~1"; fi
          npx stryker run --mutate "$(node scripts/mutation-scope.mjs --ref "$REF")"
          node scripts/mutation-check.mjs --report reports/mutation/mutation.json --min 80
        continue-on-error: true
      - name: Mutation gate, tap side (blocking)
        run: |
          REF="${{ github.event.pull_request.base.sha }}"
          if [ -z "$REF" ]; then REF="HEAD~1"; fi
          npx stryker run stryker.tap.conf.json --mutate "$(node scripts/mutation-scope.mjs --ref "$REF" --tap)"
          node scripts/mutation-check.mjs --report reports/mutation-tap/mutation.json --min 80
