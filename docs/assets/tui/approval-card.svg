<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 608" width="872" height="608" role="img" aria-labelledby="title desc"><title id="title">Kubic</title><desc id="desc">The Kubic TUI: approval-card.</desc><style>text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:14px;white-space:pre}</style><defs><g id="r0"><rect x="0" width="319.2" height="18" fill="#111115"/><rect x="319.2" width="92.4" height="18" fill="#ffb547"/><rect x="411.6" width="428.4" height="18" fill="#111115"/><text x="8.4" y="13.5" textLength="58.8" fill="#ff004d" font-weight="700">■ KUBIC</text><text x="75.6" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="92.4" y="13.5" textLength="67.2" fill="#ececf1">acme-web</text><text x="176.4" y="13.5" textLength="8.4" fill="#6e6e79">⎇</text><text x="193.2" y="13.5" textLength="33.6" fill="#a3a3ae">main</text><text x="235.2" y="13.5" textLength="16.8" fill="#ffb547">●1</text><text x="327.6" y="13.5" textLength="75.6" fill="#111115" font-weight="700">1 WAITING</text><text x="420" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="436.8" y="13.5" textLength="58.8" fill="#6e6e79">session</text><text x="504" y="13.5" textLength="201.6" fill="#a3a3ae">make slugify handle acc…</text><text x="714" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="730.8" y="13.5" textLength="75.6" fill="#6e6e79">approvals</text><text x="814.8" y="13.5" textLength="16.8" fill="#5ed68c">on</text></g><g id="r1"><rect x="33.6" width="806.4" height="18" fill="#0e2617"/><text x="16.8" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="33.6" y="13.5" textLength="25.2" fill="#7ee2a0">4 +</text><text x="100.8" y="13.5" textLength="268.8" fill="#7ee2a0">.replace(/[\u0300-\u036f]/g, '')</text></g><g id="r2"><text x="16.8" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="33.6" y="13.5" textLength="8.4" fill="#3c3c45">5</text><text x="100.8" y="13.5" textLength="117.6" fill="#a3