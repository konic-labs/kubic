<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 608" width="872" height="608" role="img" aria-labelledby="title desc"><title id="title">Kubic</title><desc id="desc">The Kubic TUI: first-screen.</desc><style>text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:14px;white-space:pre}</style><defs><g id="r0"><rect x="0" width="840" height="18" fill="#111115"/><text x="8.4" y="13.5" textLength="58.8" fill="#ff004d" font-weight="700">■ KUBIC</text><text x="75.6" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="92.4" y="13.5" textLength="67.2" fill="#ececf1">acme-web</text><text x="176.4" y="13.5" textLength="8.4" fill="#6e6e79">⎇</text><text x="193.2" y="13.5" textLength="33.6" fill="#a3a3ae">main</text><text x="495.6" y="13.5" textLength="58.8" fill="#6e6e79">session</text><text x="562.8" y="13.5" textLength="75.6" fill="#a3a3ae">0193…a7c2</text><text x="646.8" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="663.6" y="13.5" textLength="75.6" fill="#6e6e79">approvals</text><text x="747.6" y="13.5" textLength="16.8" fill="#5ed68c">on</text><text x="772.8" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="789.6" y="13.5" textLength="42" fill="#6e6e79">09:41</text></g><g id="r1"><text x="16.8" y="13.5" textLength="142.8" fill="#ff004d" font-weight="700">█▄▀ █ █ █▄▄ █ █▀▀</text></g><g id="r2"><text x="16.8" y="13.5" textLength="142.8" fill="#ff004d" font-weight="700">█ █ █▄█ █▄█ █ █▄▄</text><text x="193.2" y="13.5" textLength="319.2" fill="#6e6e79">0.1.2 · terminal coding agent by Konic</text></g><g id="r3"><text x="16.8" y="13.5" textLength="75.6" fill="#6e6e79" font-weight="700">PREFLIGHT</text></g><g id="r4"><text x="16.8" y="13.5" textLength="8.4" fill="#5ed68c">✓</text><text x="33.6" y="13.5" textLength="67.2" fill="#a3a3ae">provider</text><text x="142.8" y="13.5" textLength="109.2" fill="#ececf1">demo/scripted</text></g><g id="r5"><text x="16.8" y="13.5" textLength="8.4" fill="#5ed68c">✓</text><text x="33.6" y="13.5" textLength="58.8" fill="#a3a3ae">project</text><text x="142.8" y="13.5" textLength="126" fill="#ececf1">~/code/acme-web</text><text x="285.6" y="13.5" textLength="134.4" fill="#6e6e79">git main · clean</text></g><g id="r6"><text x="16.8" y="13.5" textLength="8.4" fill="#5ed68c">✓</text><text x="33.6" y="13.5" textLength="58.8" fill="#a3a3ae">journal</text><text x="142.8" y="13.5" textLength="16.8" fill="#ececf1">on</text><text x="176.4" y="13.5" textLength="386.4" fill="#6e6e79">every change is recorded; /undo reverts a turn</text></g><g id="r7"><text x="16.8" y="13.5" textLength="8.4" fill="#6e6e79">○</text><text x="33.6" y="13.5" textLength="75.6" fill="#a3a3ae">isolation</text><text x="142.8" y="13.5" textLength="604.8" fill="#ececf1">Kubic runs in-process with your authority: no isolation (files, network,</text></g><g id="r8"><text x="142.8" y="13.5" textLength="361.2" fill="#ececf1">credentials); controls: approvals + journal</text><text x="520.8" y="13.5" textLength="58.8" fill="#ff004d">/safety</text></g><g id="r9"><text x="16.8" y="13.5" textLength="42" fill="#6e6e79" font-weight="700">START</text></g><g id="r10"><text x="16.8" y="13.5" textLength="8.4" fill="#a3a3ae" font-weight="700">⏎</text><text x="42" y="13.5" textLength="176.4" fill="#a3a3ae">describe a task below</text><text x="285.6" y="13.5" textLength="369.6" fill="#6e6e79">e.g. "run npm test and fix the failing test"</text></g><g id="r11"><text x="16.8" y="13.5" textLength="8.4" fill="#a3a3ae" font-weight="700">/</text><text x="42" y="13.5" textLength="67.2" fill="#6e6e79">commands</text><text x="151.2" y="13.5" textLength="8.4" fill="#a3a3ae" font-weight="700">@</text><text x="176.4" y="13.5" textLength="109.2" fill="#6e6e79">attach a file</text><text x="327.6" y="13.5" textLength="16.8" fill="#a3a3ae" font-weight="700">^P</text><text x="352.8" y="13.5" textLength="58.8" fill="#6e6e79">palette</text><text x="453.6" y="13.5" textLength="8.4" fill="#a3a3ae" font-weight="700">?</text><text x="478.8" y="13.5" textLength="67.2" fill="#6e6e79">all keys</text></g><g id="r12"><text x="8.4" y="13.5" textLength="823.2" fill="#3c3c45">┌────────────────────────────────────────────────────────────────────────────────────────────────┐</text></g><g id="r13"><rect x="42" width="8.4" height="18" fill="#ececf1"/><text x="8.4" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="25.2" y="13.5" textLength="8.4" fill="#ff004d" font-weight="700">›</text><text x="705.6" y="13.5" textLength="109.2" fill="#3c3c45">@ file  / cmd</text><text x="823.2" y="13.5" textLength="8.4" fill="#3c3c45">│</text></g><g id="r14"><text x="8.4" y="13.5" textLength="823.2" fill="#3c3c45">└────────────────────────────────────────────────────────────────────────────────────────────────┘</text></g><g id="r15"><rect x="0" width="840" height="18" fill="#111115"/><text x="8.4" y="13.5" textLength="8.4" fill="#5ed68c">●</text><text x="25.2" y="13.5" textLength="109.2" fill="#a3a3ae">demo/scripted</text><text x="142.8" y="13.5" textLength="42" fill="#6e6e79">· off</text><text x="201.6" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="226.8" y="13.5" textLength="25.2" fill="#6e6e79">ctx</text><text x="260.4" y="13.5" textLength="84" fill="#3c3c45">━━━━━━━━━━</text><text x="352.8" y="13.5" textLength="16.8" fill="#a3a3ae">0%</text><text x="378" y="13.5" textLength="58.8" fill="#6e6e79">of 200k</text><text x="453.6" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="478.8" y="13.5" textLength="42" fill="#a3a3ae">$0.00</text><text x="789.6" y="13.5" textLength="42" fill="#5ed68c">ready</text></g><g id="r16"><text x="8.4" y="13.5" textLength="8.4" fill="#a3a3ae">⏎</text><text x="25.2" y="13.5" textLength="33.6" fill="#6e6e79">send</text><text x="84" y="13.5" textLength="16.8" fill="#a3a3ae">^J</text><text x="109.2" y="13.5" textLength="58.8" fill="#6e6e79">newline</text><text x="193.2" y="13.5" textLength="8.4" fill="#a3a3ae">/</text><text x="210" y="13.5" textLength="67.2" fill="#6e6e79">commands</text><text x="302.4" y="13.5" textLength="8.4" fill="#a3a3ae">@</text><text x="319.2" y="13.5" textLength="33.6" fill="#6e6e79">file</text><text x="378" y="13.5" textLength="16.8" fill="#a3a3ae">^P</text><text x="403.2" y="13.5" textLength="58.8" fill="#6e6e79">palette</text><text x="487.2" y="13.5" textLength="16.8" fill="#a3a3ae">^O</text><text x="512.4" y="13.5" textLength="33.6" fill="#6e6e79">diff</text><text x="571.2" y="13.5" textLength="16.8" fill="#a3a3ae">^R</text><text x="596.4" y="13.5" textLength="58.8" fill="#6e6e79">journal</text><text x="747.6" y="13.5" textLength="42" fill="#a3a3ae">^C ^C</text><text x="798" y="13.5" textLength="33.6" fill="#6e6e79">quit</text></g></defs><rect x=".5" y=".5" width="871" height="607" fill="#0a0a0c" stroke="#22222a"/><g transform="translate(16 16)"><g><use href="#r0" y="0"/><use href="#r1" y="36"/><use href="#r2" y="54"/><use href="#r3" y="90"/><use href="#r4" y="108"/><use href="#r5" y="126"/><use href="#r6" y="144"/><use href="#r7" y="162"/><use href="#r8" y="180"/><use href="#r9" y="216"/><use href="#r10" y="234"/><use href="#r11" y="252"/><use href="#r12" y="486"/><use href="#r13" y="504"/><use href="#r14" y="522"/><use href="#r15" y="540"/><use href="#r16" y="558"/></g></g></svg>
