<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 608" width="872" height="608" role="img" aria-labelledby="title desc"><title id="title">Kubic</title><desc id="desc">The Kubic TUI: palette.</desc><style>text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:14px;white-space:pre}</style><defs><g id="r0"><text x="8.4" y="13.5" textLength="823.2" fill="#3c3c45">■ KUBIC │ acme-web  ⎇ main ●1              session make slugify handle acc… │ approvals on │ 09:41</text></g><g id="r1"><text x="16.8" y="13.5" textLength="84" fill="#3c3c45">└ 2 passed</text></g><g id="r2"><text x="16.8" y="13.5" textLength="806.4" fill="#3c3c45">◆ slugify now strips accents: it splits each letter from its mark and drops the marks before the</text></g><g id="r3"><text x="33.6" y="13.5" textLength="285.6" fill="#3c3c45">rest is replaced. Both tests pass.</text></g><g id="r4"><text x="126" y="13.5" textLength="16.8" fill="#a3a3ae">┌─</text><text x="151.2" y="13.5" textLength="126" fill="#ff004d" font-weight="700">Command palette</text><text x="285.6" y="13.5" textLength="378" fill="#a3a3ae">─────────────────────────────────────────────</text><text x="672" y="13.5" textLength="16.8" fill="#6e6e79">^P</text><text x="697.2" y="13.5" textLength="16.8" fill="#a3a3ae">─┐</text></g><g id="r5"><rect x="159.6" width="8.4" height="18" fill="#ececf1"/><text x="16.8" y="13.5" textLength="109.2" fill="#3c3c45">✓ turn 4.6s ·</text><text x="126" y="13.5" textLength="8.4" fill="#a3a3ae">│</text><text x="142.8" y="13.5" textLength="8.4" fill="#ff004d" font-weight="700">›</text><text x="613.2" y="13.5" textLength="84" fill="#6e6e79">20 results</text><text x="705.6" y="13.5" textLength="8.4" fill="#a3a3ae">│</text><text x="730.8" y="13.5" textLength="100.8" fill="#3c3c45">/undo revert</text></g><g id="r6"><text x="126" y="13.5" textLength="8.4" fill="#a3a3ae">├</text><text x="134.4" y="13.5" textLength="571.2" fill="#3c3c45">───────────