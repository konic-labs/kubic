<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 608" width="872" height="608" role="img" aria-labelledby="title desc"><title id="title">Kubic</title><desc id="desc">The Kubic TUI: session-tree.</desc><style>text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:14px;white-space:pre}</style><defs><g id="r0"><rect x="0" width="840" height="18" fill="#111115"/><text x="8.4" y="13.5" textLength="58.8" fill="#ff004d" font-weight="700">■ KUBIC</text><text x="75.6" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="92.4" y="13.5" textLength="67.2" fill="#ececf1">acme-web</text><text x="176.4" y="13.5" textLength="8.4" fill="#6e6e79">⎇</text><text x="193.2" y="13.5" textLength="33.6" fill="#a3a3ae">main</text><text x="235.2" y="13.5" textLength="16.8" fill="#ffb547">●1</text><text x="369.6" y="13.5" textLength="58.8" fill="#6e6e79">session</text><text x="436.8" y="13.5" textLength="201.6" fill="#a3a3ae">make slugify handle acc…</text><text x="646.8" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="663.6" y="13.5" textLength="75.6" fill="#6e6e79">approvals</text><text x="747.6" y="13.5" textLength="16.8" fill="#5ed68c">on</text><text x="772.8" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="789.6" y="13.5" textLength="42" fill="#6e6e79">09:41</text></g><g id="r1"><text x="16.8" y="13.5" textLength="8.4" fill="#a3a3ae">◆</text><text x="33.6" y="13.5" textLength="613.2" fill="#ececf1">An empty string. Nothing survives the replace, so slugify('') returns ''.</text></g><g id="r2"><text x="16.8" y="13.5" textLength="8.4" fill="#5ed68c">✓</text><text x="33.6" y="13.5" textLength="151.2" fill="#a3a3ae">turn 4.6s · $0.000</text></g><g id="r3"><rect x="0" width="840" height="18" fill="#18181e"/><text x="8.4" y="13.5" textLength="8.4" fill="#ff004d">▌</text><text x="25.2" y="13.5" textLength="42" fill="#ececf1" font-weight="700">/tree</text></g><g id="r4"><text x="0" y="13.5" textLength="840" fill="#7fb4ff">────────────────────────────────────────────────────────────────────────────────────────────────────</text></g><g id="r5"><text x="25.2" y="13.5" textLength="100.8" fill="#ececf1" font-weight="700">Session tree</text></g><g id="r6"><text x="16.8" y="13.5" textLength="772.8" fill="#6e6e79">↑/↓ move · ←/→ page · alt+←/→ branch · ^X copy · L label · T label time · filters ^D/T/U/L/A</text></g><g id="r7"><text x="16.8" y="13.5" textLength="100.8" fill="#6e6e79">cycle ^O/^⇧O</text></g><g id="r8"><text x="16.8" y="13.5" textLength="126" fill="#6e6e79">Type to search:</text></g><g id="r9"><text x="16.8" y="13.5" textLength="58.8" fill="#ff004d">• user:</text><text x="84" y="13.5" textLength="394.8" fill="#ececf1">make slugify handle accents, then run the tests</text></g><g id="r10"><text x="16.8" y="13.5" textLength="8.4" fill="#ff004d">•</text><text x="33.6" y="13.5" textLength="84" fill="#5ed68c">assistant:</text><text x="126" y="13.5" textLength="201.6" fill="#ececf1">I'll read slugify first.</text></g><g id="r11"><text x="16.8" y="13.5" textLength="8.4" fill="#ff004d">•</text><text x="33.6" y="13.5" textLength="159.6" fill="#6e6e79">[read: src/slug.js]</text></g><g id="r12"><text x="16.8" y="13.5" textLength="8.4" fill="#ff004d">•</text><text x="33.6" y="13.5" textLength="84" fill="#5ed68c">assistant:</text><text x="126" y="13.5" textLength="714" fill="#ececf1">Accented letters fall through the replace. I'll split them into letter and mark, then</text></g><g id="r13"><text x="16.8" y="13.5" textLength="8.4" fill="#ff004d">•</text><text x="33.6" y="13.5" textLength="159.6" fill="#6e6e79">[edit: src/slug.js]</text></g><g id="r14"><text x="16.8" y="13.5" textLength="8.4" fill="#ff004d">•</text><text x="33.6" y="13.5" textLength="252" fill="#6e6e79">[bash: node test/slug.test.js]</text></g><g id="r15"><text x="16.8" y="13.5" textLength="8.4" fill="#ff004d">•</text><text x="33.6" y="13.5" textLength="84" fill="#5ed68c">assistant:</text><text x="126" y="13.5" textLength="714" fill="#ececf1">slugify now strips accents: it splits each letter from its mark and drops the marks b</text></g><g id="r16"><text x="16.8" y="13.5" textLength="58.8" fill="#ff004d">• user:</text><text x="84" y="13.5" textLength="184.8" fill="#ececf1">clear the build output</text></g><g id="r17"><text x="16.8" y="13.5" textLength="8.4" fill="#ff004d">•</text><text x="33.6" y="13.5" textLength="84" fill="#5ed68c">assistant:</text><text x="126" y="13.5" textLength="243.6" fill="#ececf1">I'll remove the build output.</text></g><g id="r18"><text x="16.8" y="13.5" textLength="8.4" fill="#ff004d">•</text><text x="33.6" y="13.5" textLength="159.6" fill="#6e6e79">[bash: rm -rf dist]</text></g><g id="r19"><text x="16.8" y="13.5" textLength="8.4" fill="#ff004d">•</text><text x="33.6" y="13.5" textLength="84" fill="#5ed68c">assistant:</text><text x="126" y="13.5" textLength="277.2" fill="#ececf1">Understood: dist/ stays as it is.</text></g><g id="r20"><text x="16.8" y="13.5" textLength="58.8" fill="#ff004d">• user:</text><text x="84" y="13.5" textLength="369.6" fill="#ececf1">what does slugify return for an empty title?</text></g><g id="r21"><rect x="0" width="840" height="18" fill="#18181e"/><text x="0" y="13.5" textLength="25.2" fill="#ff004d">› •</text><text x="33.6" y="13.5" textLength="84" fill="#5ed68c" font-weight="700">assistant:</text><text x="126" y="13.5" textLength="613.2" fill="#ececf1" font-weight="700">An empty string. Nothing survives the replace, so slugify('') returns ''.</text></g><g id="r22"><text x="16.8" y="13.5" textLength="58.8" fill="#6e6e79">(13/13)</text></g><g id="r23"><rect x="0" width="840" height="18" fill="#111115"/><text x="8.4" y="13.5" textLength="8.4" fill="#5ed68c">●</text><text x="25.2" y="13.5" textLength="109.2" fill="#a3a3ae">demo/scripted</text><text x="142.8" y="13.5" textLength="42" fill="#6e6e79">· off</text><text x="201.6" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="226.8" y="13.5" textLength="25.2" fill="#6e6e79">ctx</text><text x="260.4" y="13.5" textLength="84" fill="#3c3c45">━━━━━━━━━━</text><text x="352.8" y="13.5" textLength="16.8" fill="#a3a3ae">3%</text><text x="378" y="13.5" textLength="58.8" fill="#6e6e79">of 200k</text><text x="453.6" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="478.8" y="13.5" textLength="42" fill="#a3a3ae">$0.00</text><text x="537.6" y="13.5" textLength="8.4" fill="#3c3c45">│</text><text x="562.8" y="13.5" textLength="58.8" fill="#6e6e79">journal</text><text x="630" y="13.5" textLength="67.2" fill="#a3a3ae">1 change</text><text x="789.6" y="13.5" textLength="42" fill="#5ed68c">ready</text></g><g id="r24"><text x="8.4" y="13.5" textLength="8.4" fill="#a3a3ae">⏎</text><text x="25.2" y="13.5" textLength="92.4" fill="#6e6e79">go to entry</text><text x="756" y="13.5" textLength="25.2" fill="#a3a3ae">esc</text><text x="789.6" y="13.5" textLength="42" fill="#6e6e79">close</text></g></defs><rect x=".5" y=".5" width="871" height="607" fill="#0a0a0c" stroke="#22222a"/><g transform="translate(16 16)"><g><use href="#r0" y="0"/><use href="#r1" y="18"/><use href="#r2" y="54"/><use href="#r3" y="90"/><use href="#r4" y="126"/><use href="#r5" y="144"/><use href="#r6" y="162"/><use href="#r7" y="180"/><use href="#r8" y="198"/><use href="#r4" y="216"/><use href="#r9" y="252"/><use href="#r10" y="270"/><use href="#r11" y="288"/><use href="#r12" y="306"/><use href="#r13" y="324"/><use href="#r14" y="342"/><use href="#r15" y="360"/><use href="#r16" y="378"/><use href="#r17" y="396"/><use href="#r18" y="414"/><use href="#r19" y="432"/><use href="#r20" y="450"/><use href="#r21" y="468"/><use href="#r22" y="486"/><use href="#r4" y="522"/><use href="#r23" y="540"/><use href="#r24" y="558"/></g></g></svg>
